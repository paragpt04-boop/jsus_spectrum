name: jsus_spectrum
description: JSUS+ · Generador de espectros de audio
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  just_audio: ^0.9.40
  ffmpeg_kit_flutter_new: ^4.6.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bg.png
    - assets/circle.png

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.17
